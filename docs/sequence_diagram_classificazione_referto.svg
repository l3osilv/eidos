<rect x="632.4" y="406" width="295.2" height="64" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1" rx="4" />
<text x="780" y="424" text-anchor="middle" font-size="11.5" fill="#7d6608" font-style="italic">Per ciascuna classe: preprocessing</text>
<text x="780" y="440" text-anchor="middle" font-size="11.5" fill="#7d6608" font-style="italic">(maschera circolare, CLAHE, multi-window)</text>
<text x="780" y="456" text-anchor="middle" font-size="11.5" fill="#7d6608" font-style="italic">+ forward pass MIL + sigmoid</text>
<line x1="780" y1="490" x2="360" y2="490" stroke="#475569" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrowDashed)" />
<text x="570.0" y="482" text-anchor="middle" font-size="12.5" fill="#475569" font-style="italic">{label: probability, ...}</text>
