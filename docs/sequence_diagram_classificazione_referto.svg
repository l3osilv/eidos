<text x="235.0" y="626" text-anchor="middle" font-size="12.5" fill="#475569" font-style="italic">200 OK — ClassificationResponse</text>
<line x1="40" y1="680" x2="1060" y2="680" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="2,3" />
<rect x="330.0" y="666" width="440" height="26" fill="white" />
<text x="550.0" y="684" text-anchor="middle" font-size="12.5" fill="#475569" font-weight="600">in seguito, il medico richiede la generazione del referto</text>
