<text x="670.0" y="948" text-anchor="middle" font-size="12.5" fill="#1f2937" font-style="normal">generate_from_findings(findings)</text>
<rect x="839.6" y="1002" width="280.8" height="48" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1" rx="4" />
<text x="980" y="1020" text-anchor="middle" font-size="11.5" fill="#7d6608" font-style="italic">Compone Tecnica / Reperti / Conclusioni</text>
<text x="980" y="1036" text-anchor="middle" font-size="11.5" fill="#7d6608" font-style="italic">da template, in ordine fisso per classe</text>
